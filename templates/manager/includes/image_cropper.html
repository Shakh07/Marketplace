<!-- reusable_cropper.html -->
<style>
/* Drag & Drop Zone */
.cropper-dropzone {
    width: 100%;
    min-height: 140px;
    border: 2px dashed rgba(0,0,0,0.15);
    border-radius: 16px;
    background: #fdfdfd;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
}

.cropper-dropzone:hover, .cropper-dropzone.dragover {
    border-color: #0071e3;
    background: rgba(0,113,227,0.03);
}

.cropper-dz-content {
    pointer-events: none;
    text-align: center;
    padding: 20px;
}

.cropper-dz-icon {
    width: 40px;
    height: 40px;
    color: #0071e3;
    margin-bottom: 12px;
}

.cropper-dz-title {
    font-size: 15px;
    font-weight: 600;
    color: #1d1d1f;
    margin-bottom: 4px;
}

.cropper-dz-sub {
    font-size: 13px;
    color: #86868b;
}

.cropper-preview-img {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #f5f5f7;
    z-index: 5;
    display: none;
}

.cropper-action-btns {
    position: absolute;
    bottom: 12px;
    right: 12px;
    display: none;
    gap: 8px;
    z-index: 10;
}
.cropper-dropzone.has-image .cropper-action-btns {
    display: flex;
}
.cropper-change-btn, .cropper-delete-btn {
    background: rgba(0,0,0,0.6);
    color: white;
    font-size: 12px;
    font-weight: 500;
    padding: 6px 12px;
    border-radius: 999px;
    pointer-events: auto;
    cursor: pointer;
    backdrop-filter: blur(4px);
    transition: all 0.2s;
}
.cropper-delete-btn {
    background: rgba(255, 59, 48, 0.8);
}
.cropper-change-btn:hover { background: rgba(0,0,0,0.8); }
.cropper-delete-btn:hover { background: #ff3b30; }

.cropper-dropzone.has-image .cropper-preview-img {
    display: block;
}

.cropper-dropzone.has-image .cropper-dz-content {
    opacity: 0;
}

/* Modal Overlay */
.cropper-modal-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.65);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    z-index: 999999;
    display: none;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.3s;
}

.cropper-modal-overlay.active {
    display: flex;
    opacity: 1;
}

.mgr-image-modal {
    background: #1d1d1f;
    border-radius: 20px;
    width: 90%;
    max-width: 860px;
    display: flex;
    flex-direction: column;
    box-shadow: 0 40px 100px rgba(0,0,0,0.5);
    transform: translateY(20px) scale(0.98);
    transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    border: 1px solid rgba(255,255,255,0.08);
    overflow: hidden;
    margin: auto; /* Fallback centering */
}

.cropper-modal-overlay.active .mgr-image-modal {
    transform: translateY(0) scale(1);
}

.cropper-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 24px;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    background: #1d1d1f;
    z-index: 10;
}

.cropper-title {
    font-size: 16px;
    font-weight: 600;
    color: #f5f5f7;
    letter-spacing: -0.01em;
}

.cropper-close {
    background: rgba(255,255,255,0.08);
    border: none;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: #a1a1a6;
    transition: all 0.2s;
}

.cropper-close:hover {
    background: rgba(255,255,255,0.15);
    color: #ffffff;
}

.cropper-body {
    width: 100%;
    height: 60vh;
    min-height: 400px;
    background: #000000;
    position: relative;
    flex-shrink: 0;
}

.cropper-img-wrapper {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    overflow: hidden;
}

/* Override cropperjs background for sleek look */
.cropper-view-box,
.cropper-face {
    border-radius: 0;
}
.cropper-bg {
    background-image: none !important;
    background-color: #000000 !important;
}

/* Make cropper controls blue like iOS */
.cropper-modal-overlay .cropper-view-box {
    outline: 2px solid #0a84ff;
    outline-color: rgba(10, 132, 255, 0.9);
}
.cropper-modal-overlay .cropper-line {
    background-color: #0a84ff;
}
.cropper-modal-overlay .cropper-point {
    background-color: #0a84ff;
}

.cropper-footer {
    padding: 16px 24px;
    border-top: 1px solid rgba(255,255,255,0.05);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    background: #1d1d1f;
    z-index: 10;
}

.cropper-footer-right {
    display: flex;
    gap: 12px;
}

.cropper-zoom-controls {
    display: flex;
    gap: 8px;
}

.cropper-btn-icon {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,0.08);
    color: #e5e5ea;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s;
}
.cropper-btn-icon:hover {
    background: rgba(255,255,255,0.15);
    color: #fff;
}

.cropper-btn-cancel {
    padding: 10px 20px;
    border-radius: 12px;
    border: none;
    background: rgba(255,255,255,0.08);
    color: #e5e5ea;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
}
.cropper-btn-cancel:hover { 
    background: rgba(255,255,255,0.15); 
    color: #fff; 
}

.cropper-btn-save {
    padding: 10px 24px;
    border-radius: 12px;
    border: none;
    background: #0a84ff;
    color: white;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
}
.cropper-btn-save:hover { 
    background: #007aff; 
    box-shadow: 0 4px 12px rgba(10, 132, 255, 0.3); 
}
</style>

<!-- Hidden UI Template to be injected into forms -->
<template id="cropper-ui-template">
    <div class="cropper-dropzone" id="cropper-dz">
        <div class="cropper-dz-content">
            <svg class="cropper-dz-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
            <div class="cropper-dz-title">Rasmni yuklash (yoki tashlash)</div>
            <div class="cropper-dz-sub">Faylni tanlang yoki shu yerga olib keling</div>
        </div>
        <img class="cropper-preview-img" src="" alt="Preview">
        <div class="cropper-action-btns">
            <div class="cropper-delete-btn">O'chirish</div>
            <div class="cropper-change-btn">O'zgartirish</div>
        </div>
        <!-- Actual input that gets the cropped file, will be hidden completely -->
        <!-- The form will continue having the original input, we just inject our logic to update the original input's files array -->
    </div>
</template>

<div class="cropper-modal-overlay" id="cropper-modal-overlay">
    <div class="mgr-image-modal">
        <div class="cropper-header">
            <div class="cropper-title">Rasmni Qirqish</div>
            <button type="button" class="cropper-close" id="cropper-modal-close">
                <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
        </div>
        <div class="cropper-body">
            <div class="cropper-img-wrapper" id="cropper-img-wrapper">
                <!-- dynamic image injection happens here -->
            </div>
        </div>
        <div class="cropper-footer">
            <div class="cropper-zoom-controls">
                <button type="button" class="cropper-btn-icon" id="cropper-btn-zoom-in" title="Kattalashtirish">
                    <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="11" y1="8" x2="11" y2="14"></line><line x1="8" y1="11" x2="14" y2="11"></line></svg>
                </button>
                <button type="button" class="cropper-btn-icon" id="cropper-btn-zoom-out" title="Kichiklashtirish">
                    <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="8" y1="11" x2="14" y2="11"></line></svg>
                </button>
            </div>
            <div class="cropper-footer-right">
                <button type="button" class="cropper-btn-cancel" id="cropper-btn-cancel">Bekor qilish</button>
                <button type="button" class="cropper-btn-cancel" id="cropper-btn-skip">Aslini saqlash</button>
                <button type="button" class="cropper-btn-save" id="cropper-btn-save">Qirqishni qo'llash</button>
            </div>
        </div>
    </div>
</div>

<script>
class ImageUploader {
    constructor(fileInputId, aspectRatio = null) {
        this.fileInput = document.getElementById(fileInputId);
        if (!this.fileInput) return;
        
        this.aspectRatio = aspectRatio;
        this.cropper = null;
        
        this.setupUI();
        this.attachEvents();
    }
    
    setupUI() {
        // Hide the original file input completely
        this.fileInput.style.display = 'none';
        
        // Clone our custom dropzone template and insert before the input
        const template = document.getElementById('cropper-ui-template');
        const widget = template.content.cloneNode(true);
        this.fileInput.parentNode.insertBefore(widget, this.fileInput);
        
        this.dropzone = this.fileInput.parentNode.querySelector('.cropper-dropzone');
        this.previewImg = this.dropzone.querySelector('.cropper-preview-img');
    }
    
    triggerFileInput() {
        this.fileInput.click();
    }

    attachEvents() {
        this.deleteBtn = this.dropzone.querySelector('.cropper-delete-btn');
        this.changeBtn = this.dropzone.querySelector('.cropper-change-btn');
        
        // When the hidden input changes (via triggerFileInput or manual select)
        this.fileInput.onchange = (e) => {
            if (e.target.files && e.target.files.length > 0) {
                this.openCropper(e.target.files[0]);
            }
        };

        // Dropzone interactions
        this.dropzone.addEventListener('click', () => {
            if (this.dropzone.classList.contains('has-image')) return; // Clicking image shouldn't trigger, must click a button explicitly
            this.triggerFileInput();
        });
        
        this.changeBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            this.triggerFileInput();
        });
        
        this.deleteBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            
            // Clear inputs
            const dt = new DataTransfer();
            this.fileInput.files = dt.files;
            
            // Clear visualization
            this.previewImg.src = '';
            this.dropzone.classList.remove('has-image');
            
            // Django DB link removal for existing items (checking the underlying hidden checkbox)
            const formGroup = this.fileInput.closest('.mgr-form-group');
            if (formGroup) {
                const clearCheck = formGroup.querySelector(`input[name="${this.fileInput.name}-clear"]`);
                if (clearCheck) {
                    clearCheck.checked = true;
                }
            }
        });
        
        this.dropzone.addEventListener('dragover', (e) => {
            e.preventDefault();
            this.dropzone.classList.add('dragover');
        });
        
        this.dropzone.addEventListener('dragleave', () => {
            this.dropzone.classList.remove('dragover');
        });
        
        this.dropzone.addEventListener('drop', (e) => {
            e.preventDefault();
            this.dropzone.classList.remove('dragover');
            if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                this.openCropper(e.dataTransfer.files[0]);
            }
        });
        
        this.modal = document.getElementById('cropper-modal-overlay');
        
        if (this.modal && this.modal.parentNode !== document.body) {
            document.body.appendChild(this.modal);
        }
        
        this.imageWrapper = document.getElementById('cropper-img-wrapper');
        
        document.getElementById('cropper-modal-close').onclick = () => this.closeModal();
        document.getElementById('cropper-btn-cancel').onclick = () => this.closeModal();
        document.getElementById('cropper-btn-save').onclick = () => this.handleCropSave();
        document.getElementById('cropper-btn-skip').onclick = () => this.handleCropSkip();
        
        document.getElementById('cropper-btn-zoom-in').onclick = () => {
            if (this.cropper) this.cropper.zoom(0.1);
        };
        document.getElementById('cropper-btn-zoom-out').onclick = () => {
            if (this.cropper) this.cropper.zoom(-0.1);
        };
    }
    
    openCropper(file) {
        if (!file.type.startsWith('image/')) {
            alert('Faqat rasmlarni (JPEG, PNG, WEBP) yuklash mumkin.');
            return;
        }

        this.activeFileName = file.name || 'image.jpg';
        this.activeFileType = file.type || 'image/jpeg';
        this.activeOriginalFile = file;
        
        const reader = new FileReader();
        reader.onload = (e) => {
            this.modal.classList.add('active');
            
            if (this.cropper) {
                this.cropper.destroy();
                this.cropper = null;
            }
            
            // Re-construct the image object entirely to give Cropper.js a purely clean slate
            this.imageWrapper.innerHTML = '';
            const img = document.createElement('img');
            img.src = e.target.result;
            img.style.display = 'block';
            img.style.maxWidth = '100%';
            img.style.maxHeight = '100%';
            this.imageWrapper.appendChild(img);
            this.modalImage = img;
            
            // Timeout ensures browser computes absolute layout dimensions before Cropper calculates bounds
            setTimeout(() => {
                this.cropper = new Cropper(this.modalImage, {
                    aspectRatio: this.aspectRatio,
                    viewMode: 1, 
                    dragMode: 'move',
                    autoCropArea: 0.9,
                    restore: false,
                    guides: true,
                    center: true,
                    highlight: false,
                    cropBoxMovable: true,
                    cropBoxResizable: true,
                    toggleDragModeOnDblclick: false,
                    background: false,
                });
            }, 100);
        };
        reader.readAsDataURL(file);
    }
    
    closeModal() {
        this.modal.classList.remove('active');
        if (this.cropper) {
            this.cropper.destroy();
            this.cropper = null;
        }
    }

    handleCropSkip() {
        if (!this.activeOriginalFile) return;

        // Inject original file directly using DataTransfer
        const dataTransfer = new DataTransfer();
        dataTransfer.items.add(this.activeOriginalFile);
        this.fileInput.files = dataTransfer.files;
        
        // Update preview using original file
        const reader = new FileReader();
        reader.onload = (e) => {
            this.previewImg.src = e.target.result;
            this.dropzone.classList.add('has-image');
            
            // Hide old standalone preview image if exists
            const formGroup = this.fileInput.closest('.mgr-form-group');
            if (formGroup) {
                const oldPreviewDiv = formGroup.querySelector('div[style*="width: 80px"]');
                if (oldPreviewDiv) { oldPreviewDiv.style.display = 'none'; }
            }
            
            this.closeModal();
        };
        reader.readAsDataURL(this.activeOriginalFile);
    }
    
    handleCropSave() {
        if (!this.cropper) return;
        
        // Get cropped canvas
        const canvas = this.cropper.getCroppedCanvas({
            maxWidth: 1200,
            maxHeight: 1200,
            fillColor: '#fff',
            imageSmoothingEnabled: true,
            imageSmoothingQuality: 'high',
        });
        
        // Convert to blob and inject into hidden file input
        canvas.toBlob((blob) => {
            // Create a new File object
            const file = new File([blob], this.activeFileName, { type: this.activeFileType });
            
            // Inject into native input using DataTransfer
            const dataTransfer = new DataTransfer();
            dataTransfer.items.add(file);
            this.fileInput.files = dataTransfer.files;
            
            // Update preview and UI
            this.previewImg.src = canvas.toDataURL(this.activeFileType);
            this.dropzone.classList.add('has-image');
            
            // Hide old standalone preview image if exists (the original django one)
            // It sits inside .mgr-form-group which is the parent of custom-file-wrap
            const formGroup = this.fileInput.closest('.mgr-form-group');
            if (formGroup) {
                const oldPreviewDiv = formGroup.querySelector('div[style*="width: 80px"]');
                if (oldPreviewDiv) { oldPreviewDiv.style.display = 'none'; }
            }
            
            this.closeModal();
            
        }, this.activeFileType, 0.9);
    }
}
</script>
